services:
  postgres:
    image: postgres:16
    container_name: marketsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketsync"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: deps
    container_name: marketsync-app
    restart: unless-stopped
    command: npm run dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/marketsync
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules:
  app_next:
